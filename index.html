<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>DayOne — Build the person you want to become.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Premium background & spotlight effects -->
    <div id="curtain"><div class="mark">LOADING DAYONE</div></div>
    <canvas id="particles"></canvas>
    <div id="spotlight"></div>
    <div class="grain"></div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      /* ---------- Page load curtain ---------- */
      // Hide the curtain as soon as DOM is ready to make the app feel incredibly fast
      function hideCurtain() {
        const curtain = document.getElementById('curtain');
        if (curtain && !curtain.classList.contains('hide')) {
          curtain.classList.add('hide');
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', hideCurtain);
      } else {
        hideCurtain();
      }

      // Safety fallback
      window.addEventListener('load', hideCurtain);
      setTimeout(hideCurtain, 1500); // hard limit to ensure loader is never stuck

      /* ---------- Particle network background ---------- */
      const canvas = document.getElementById('particles');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        let w, h, particles = [];
        const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        
        function resize() {
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        
        const COUNT = Math.min(60, Math.floor(w / 25));
        for (let i = 0; i < COUNT; i++) {
          particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            vx: (Math.random() - 0.5) * 0.25,
            vy: (Math.random() - 0.5) * 0.25,
            r: Math.random() * 1.2 + 0.6
          });
        }
        
        function step() {
          if (!ctx) return;
          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = 'rgba(139, 92, 246, 0.4)';
          
          for (const p of particles) {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0 || p.x > w) p.vx *= -1;
            if (p.y < 0 || p.y > h) p.vy *= -1;
          }
          
          for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
              const a = particles[i], b = particles[j];
              const d = Math.hypot(a.x - b.x, a.y - b.y);
              if (d < 120) {
                ctx.strokeStyle = `rgba(148, 163, 184, ${0.08 * (1 - d / 120)})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
              }
            }
          }
          
          for (const p of particles) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }
          
          if (!REDUCE) requestAnimationFrame(step);
        }
        step();
      }

      /* ---------- Cursor spotlight ---------- */
      const spotlight = document.getElementById('spotlight');
      if (spotlight) {
        window.addEventListener('mousemove', (e) => {
          spotlight.style.opacity = '1';
          spotlight.style.left = e.clientX + 'px';
          spotlight.style.top = e.clientY + 'px';
        });
        window.addEventListener('mouseleave', () => {
          spotlight.style.opacity = '0';
        });
      }
    </script>
  </body>
</html>
